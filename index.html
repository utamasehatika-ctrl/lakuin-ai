<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuan Creator ULTRA – V.20</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#022c22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(160deg,#020617,#022c22);
  color:#fff;
  padding:20px;
}
.app{
  max-width:1300px;
  margin:auto;
  background:#0b3a34;
  padding:30px;
  border-radius:26px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
h1{text-align:center}
.small{text-align:center;font-size:13px;opacity:.75}
label{display:block;margin-top:14px;font-size:13px}
input,select,textarea,button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border-radius:14px;
  border:none;
}
textarea{
  min-height:460px;
  background:#020617;
  color:#e5e7eb;
}
button{
  background:linear-gradient(90deg,#22c55e,#38bdf8);
  font-weight:bold;
  margin-top:18px;
  cursor:pointer;
}
.copy{background:#2563eb}
.badge{
  background:#16a34a;
  padding:5px 14px;
  border-radius:20px;
  font-size:11px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
@media(max-width:768px){
  .grid{grid-template-columns:1fr}
}
.install{
  background:#16a34a;
  display:none;
}
</style>
</head>

<body>

<div class="app">
<h1>🔥 CuanCreator ULTRA <span class="badge">LEVEL 20</span></h1>
<p class="small">Ribuan Script • Anti Duplikat • Multi Bahasa • Story & Hard Sell</p>

<button id="installBtn" class="install">📲 INSTALL APLIKASI</button>

<div class="grid">
<div>
<label>Nama Produk</label>
<input id="produk" placeholder="contoh: Jaket Wanita Premium">
</div>
<div>
<label>Kategori</label>
<select id="kategori">
  <option>Fashion</option>
  <option>Kosmetik</option>
  <option>F&B</option>
  <option>Elektronik</option>
  <option>Rumah Tangga</option>
  <option>Otomotif</option>
</select>
</div>
</div>

<div class="grid">
<div>
<label>Platform</label>
<select id="platform">
  <option>TikTok / Reels</option>
  <option>Facebook / Instagram</option>
  <option>Ads</option>
</select>
</div>
<div>
<label>Jenis Konten</label>
<select id="mode">
  <option value="affiliate">Affiliate</option>
  <option value="story">Story Telling</option>
  <option value="hard">Hard Selling</option>
</select>
</div>
</div>

<div class="grid">
<div>
<label>Bahasa</label>
<select id="bahasa">
  <option value="id">Indonesia</option>
  <option value="id-santai">Indonesia Santai</option>
  <option value="emak">Indonesia Emak-emak</option>
  <option value="jawa-medok">Jawa Medok Emak-emak</option>
  <option value="jawa-halus">Jawa Halus</option>
  <option value="jawa-mix">Jawa Campur Indo</option>
  <option value="auto-jawa">Auto Translate Indo → Jawa</option>
</select>
</div>
<div>
<label>Jumlah Generate</label>
<select id="jumlah">
  <option value="100">100</option>
  <option value="300">300</option>
  <option value="500">500</option>
  <option value="1000">1000</option>
</select>
</div>
</div>

<label>Fokus Tambahan (opsional)</label>
<input id="custom" placeholder="murah, premium, viral, emak-emak">

<button onclick="generate()">⚡ GENERATE LEVEL 20</button>

<textarea id="output" placeholder="Script ribuan konten muncul di sini..."></textarea>

<button class="copy" onclick="copy()">📋 COPY</button>
<button class="copy" onclick="exportTXT()">⬇ EXPORT TXT</button>
</div>

<script>
/* ===== SERVICE WORKER ===== */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}

/* ===== INSTALL PROMPT ===== */
let deferredPrompt;
const installBtn=document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredPrompt=e;
  installBtn.style.display="block";
});

installBtn.onclick=()=>{
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>installBtn.style.display="none");
};

/* ===== SCRIPT ASLI (TIDAK DIRUSAK) ===== */
function r(a){return a[Math.floor(Math.random()*a.length)]}

/* DATA LEVEL 19 & 20 (TETAP) */
/* === isi SCRIPT kamu TETAP sama persis seperti sebelumnya === */
</script>

</body>
</html>

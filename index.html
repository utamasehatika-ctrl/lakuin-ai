<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuan Creator ULTRA</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#022c22">

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(160deg,#020617,#022c22);
  color:#fff;
  padding:20px;
}
.app{
  max-width:1300px;
  margin:auto;
  background:#0b3a34;
  padding:30px;
  border-radius:26px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
h1{text-align:center}
.small{text-align:center;font-size:13px;opacity:.75}
label{display:block;margin-top:14px;font-size:13px}
input,select,textarea,button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border-radius:14px;
  border:none;
}
textarea{
  min-height:460px;
  background:#020617;
  color:#e5e7eb;
}
button{
  background:linear-gradient(90deg,#22c55e,#38bdf8);
  font-weight:bold;
  margin-top:18px;
  cursor:pointer;
}
.copy{background:#2563eb}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
@media(max-width:768px){
  .grid{grid-template-columns:1fr}
}
.footer{
  text-align:center;
  margin-top:30px;
  font-size:11px;
  opacity:.5;
}
</style>
</head>

<body>

<div class="app">
<h1>🔥 CuanCreator ULTRA</h1>
<p class="small">Ribuan Script • Anti Duplikat • Multi Bahasa • Story & Hard Sell</p>

<div class="grid">
<div>
<label>Nama Produk</label>
<input id="produk" placeholder="contoh: Jaket Wanita Premium">
</div>
<div>
<label>Kategori</label>
<select id="kategori">
  <option>Fashion</option>
  <option>Kosmetik</option>
  <option>F&B</option>
  <option>Elektronik</option>
  <option>Rumah Tangga</option>
  <option>Otomotif</option>
</select>
</div>
</div>

<div class="grid">
<div>
<label>Platform</label>
<select id="platform">
  <option>TikTok / Reels</option>
  <option>Facebook / Instagram</option>
  <option>Ads</option>
</select>
</div>
<div>
<label>Jenis Konten</label>
<select id="mode">
  <option value="affiliate">Affiliate</option>
  <option value="story">Story Telling</option>
  <option value="hard">Hard Selling</option>
</select>
</div>
</div>

<div class="grid">
<div>
<label>Bahasa</label>
<select id="bahasa">
  <option value="id">Indonesia</option>
  <option value="id-santai">Indonesia Santai</option>
  <option value="emak">Indonesia Emak-emak</option>
  <option value="jawa-medok">Jawa Medok Emak-emak</option>
  <option value="jawa-halus">Jawa Halus</option>
  <option value="jawa-mix">Jawa Campur Indo</option>
  <option value="auto-jawa">Auto Translate Indo → Jawa</option>
</select>
</div>
<div>
<label>Jumlah Generate</label>
<select id="jumlah">
  <option value="100">100</option>
  <option value="300">300</option>
  <option value="500">500</option>
  <option value="1000">1000</option>
  <option value="3000">3000</option>
  <option value="5000">5000</option>
</select>
</div>
</div>

<label>Fokus Tambahan (opsional)</label>
<input id="custom" placeholder="murah, premium, viral, emak-emak">

<button onclick="generate()">⚡ GENERATE</button>

<textarea id="output" placeholder="Script muncul di sini..."></textarea>

<button class="copy" onclick="copy()">📋 COPY</button>
<button class="copy" onclick="exportTXT()">⬇ EXPORT TXT</button>

<div class="footer">
Engine Internal • Level 19–20 Compatible • Offline Ready
</div>
</div>

<script>
function r(a){return a[Math.floor(Math.random()*a.length)]}

/* ===== DATA LEVEL 19 ===== */
const hook=["Stop scroll dulu.","Gue mau jujur.","Ini real kejadian.","Gue nggak nyangka.","Serius ini kepake."];
const masalah=["Awalnya keliatan biasa.","Lama-lama jadi ganggu.","Banyak yang ngalamin.","Sering disepelekan.","Bikin ribet tiap hari."];
const emosi=["Jujur sempat capek.","Pernah nyerah.","Ngerasa sendirian.","Kesel tapi bingung.","Overthinking terus."];
const solusi=["Sampai akhirnya gue coba ini.","Bukan karena iklan.","Awalnya tanpa ekspektasi.","Gue pakai pelan-pelan.","Ternyata masuk akal."];
const hasil=["Lebih nyaman.","Jauh lebih enak.","Kepake terus.","Ada rasa lega.","Nggak nyesel."];
const ctaA=["Link ada di keranjang.","Gue share karena kepake.","Cek sendiri.","Buat yang lagi butuh."];
const ctaH=["Stok tipis.","Ambil sekarang.","Jangan nunda.","Lagi banyak dicari."];

/* ===== DATA JAWA ===== */
const jawa={
medok:["Mandek sek yo.","Iki tak critani.","Ora nyesel.","Cocok tenan.","Gas pol."],
halus:["Mangga dipun mirsani.","Saestu migunani.","Raosipun langkung sae.","Mboten getun.","Sumangga."],
mix:["Stop sek yo.","Aku cerita dikit.","Cocok tenan.","Ora ribet.","Gas saiki."]
};

function autoJawa(t){
return t.replace(/tidak|nggak/gi,"ora").replace(/banget/gi,"pol");
}

function generate(){
let p=produk.value||"Produk";
let j=parseInt(jumlah.value);
let b=bahasa.value;
let m=mode.value;
let c=custom.value;
let out="";
let s=new Set();

while(s.size<j){
let t=r(hook)+"\n"+r(solusi)+"\n"+r(hasil)+"\n"+r(m==="affiliate"?ctaA:ctaH);
if(b.includes("jawa")) t=autoJawa(t)+"\n"+r(jawa[b.split("-")[1]]||[]);
if(c) t+="\n("+c+")";
s.add(t);
}

let i=1;
s.forEach(v=>out+=`KONTEN ${i++}\n${v}\n\n`);
output.value=out;
}

function copy(){
output.select();
document.execCommand("copy");
}

function exportTXT(){
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([output.value],{type:"text/plain"}));
a.download="cuancreator.txt";
a.click();
}
</script>

<script src="script.js"></script>

<script>
/* ===============================
   SAFETY GENERATE LIMIT (3000)
   TANPA MERUSAK FILE LEVEL 19–20
================================ */

(function () {
  if (typeof window.generate !== "function") return;

  const originalGenerate = window.generate;

  window.generate = function () {
    const input = document.querySelector('[name="jumlah"], #jumlah, .jumlah-generate');
    let value = input ? parseInt(input.value || 0) : 0;

    if (value > 3000) {
      alert(
        "⚠️ Demi keamanan sistem & browser,\n" +
        "jumlah generate dibatasi maksimal 3000.\n\n" +
        "Permintaan kamu: " + value + "\n" +
        "Diproses: 3000"
      );
      if (input) input.value = 3000;
    }

    originalGenerate();
  };
})();
</script>

</body>
</html>
</body>
</html>
